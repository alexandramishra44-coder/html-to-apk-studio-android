# Build a real Android APK using Capacitor + Gradle on GitHub-hosted runners
# Inspired by open-source projects:
#   - cemcoe/web-to-apk-action
#   - ionic-team/capacitor
#   - official Android Gradle tooling

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: true
        default: 'APK Studio'
      package_id:
        description: 'Android package name (e.g. com.yourname.apkstudio)'
        required: true
        default: 'com.htmltoapk.studio'
      version_name:
        description: 'Version name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install platform & build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Update Capacitor config from inputs
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.appName = process.env.APP_NAME;
            cfg.appId = process.env.PACKAGE_ID;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Android app name, package & version
        run: |
          # Update strings.xml
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ github.event.inputs.app_name }}</string>|" "$STRINGS"
          fi

          # Update build.gradle
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s|applicationId \".*\"|applicationId \"${{ github.event.inputs.package_id }}\"|" "$GRADLE"
            sed -i "s|versionCode [0-9]*|versionCode ${{ github.event.inputs.version_code }}|" "$GRADLE"
            sed -i "s|versionName \".*\"|versionName \"${{ github.event.inputs.version_name }}\"|" "$GRADLE"
            # Ensure minSdk is reasonable
            sed -i "s|minSdkVersion [0-9]*|minSdkVersion 24|" "$GRADLE" || true
            sed -i "s|targetSdkVersion [0-9]*|targetSdkVersion 34|" "$GRADLE" || true
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Studio-${{ github.event.inputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
